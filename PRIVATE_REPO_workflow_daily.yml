name: Daily run

on:
  schedule:
    # 22:00 UTC = ~17:00 ET = ~1 hour after US market close
    # Weekdays only
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh universe (Mondays only)
        if: github.event.schedule == '0 22 * * 1' || github.event_name == 'workflow_dispatch'
        run: python make_universe.py
        continue-on-error: true

      - name: Run strategies
        run: python run_daily.py

      - name: Build dashboard data
        run: python build_dashboard_data.py

      - name: Commit private results
        run: |
          git config user.name "csf-bot"
          git config user.email "csf-bot@users.noreply.github.com"
          git add signals/ reports/ logs/ data/ dashboard_output/
          git diff --quiet && git diff --staged --quiet || git commit -m "Daily run $(date -u +%Y-%m-%d)"
          git push

      - name: Checkout public dashboard repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.DASHBOARD_REPO }}    # e.g. "yourusername/csf-dashboard"
          path: csf-dashboard
          token: ${{ secrets.DASHBOARD_PAT }}          # Personal Access Token with repo write scope

      - name: Sync sanitised data to public repo
        run: |
          mkdir -p csf-dashboard/data
          cp dashboard_output/*.json csf-dashboard/data/
          cd csf-dashboard
          git config user.name "csf-bot"
          git config user.email "csf-bot@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update dashboard data $(date -u +%Y-%m-%d)"
          git push
